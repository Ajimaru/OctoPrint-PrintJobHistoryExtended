<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Print Job History Extended plugin icon">
  <title>Print Job History Extended</title>
  <defs>
    <radialGradient id="bg-grad" cx="30%" cy="70%" r="85%">
      <stop offset="0%" stop-color="#161c23"/>
      <stop offset="55%" stop-color="#080a0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="core-glow" gradientUnits="userSpaceOnUse" cx="28" cy="36" r="24">
      <stop offset="0%" stop-color="#6fb7ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6fb7ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="header-grad" gradientUnits="userSpaceOnUse" x1="10.5" y1="12.5" x2="43.5" y2="21.5">
      <stop offset="0%" stop-color="#5cb0ff"/>
      <stop offset="55%" stop-color="#3a8dff"/>
      <stop offset="100%" stop-color="#123a80"/>
    </linearGradient>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black backdrop -->
  <rect x="0" y="0" width="64" height="64" rx="13" fill="url(#bg-grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="12.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="28" cy="36" r="24" fill="url(#core-glow)"/>

  <!-- Older log sheets behind -->
  <rect x="16" y="8" width="32" height="36" rx="4" fill="#0c141d" stroke="#3a8dff" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Job log -->
  <g filter="url(#soft-glow)">
    <rect x="10.5" y="12.5" width="33" height="39" rx="4.5" fill="#101b27" stroke="#cfe4ff" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M10.5 17 A4.5 4.5 0 0 1 15 12.5 H39 A4.5 4.5 0 0 1 43.5 17 V21.5 H10.5 Z" fill="url(#header-grad)"/>

    <!-- Printed part in the header: stacked layers -->
    <g fill="#ffffff" fill-opacity="0.92">
      <rect x="24.5" y="14" width="5" height="1.4" rx="0.7"/>
      <rect x="22.5" y="16.5" width="9" height="1.4" rx="0.7"/>
      <rect x="20.5" y="19" width="13" height="1.4" rx="0.7"/>
    </g>

    <!-- Recorded jobs: result dot and duration -->
    <circle cx="17" cy="28.5" r="2.1" fill="#38d94a"/>
    <rect x="22" y="27.4" width="15" height="2.2" rx="1.1" fill="#cfe4ff" fill-opacity="0.6"/>

    <circle cx="17" cy="36.5" r="2.1" fill="#ffb347"/>
    <rect x="22" y="35.4" width="11.5" height="2.2" rx="1.1" fill="#cfe4ff" fill-opacity="0.6"/>

    <circle cx="17" cy="44.5" r="2.1" fill="#ff4d3d"/>
    <rect x="22" y="43.4" width="12" height="2.2" rx="1.1" fill="#cfe4ff" fill-opacity="0.6"/>
  </g>

  <!-- History clock -->
  <g filter="url(#soft-glow)">
    <circle cx="45.5" cy="46" r="10.3" fill="#05070a"/>
    <circle cx="45.5" cy="46" r="10.3" fill="none" stroke="#a8d6ff" stroke-opacity="0.75" stroke-width="1.8"/>
    <path d="M45.5 39.4 V46 L49.9 48.6" fill="none" stroke="#cfe4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="45.5" cy="46" r="1.3" fill="#cfe4ff"/>
  </g>
</svg>

# Local MySQL server for developing/testing the external-database support.
#   docker compose up -d mysql
services:
  mysql:
    image: "mysql:8"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: printjobhistoryextended
      MYSQL_USER: printjobhistory
      MYSQL_PASSWORD: printjobhistory
    # utf8mb4 so emoji in file names and notes survive; MySQL's "utf8" is only 3 bytes.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - database-data:/var/lib/mysql
    ports:
      - 3306:3306
volumes:
  database-data:

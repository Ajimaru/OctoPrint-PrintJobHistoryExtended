[flake8]
# This code base uses tab indentation for Python (see .editorconfig), inherited from
# the upstream plugin. The tab-related checks are therefore disabled rather than
# reformatting the whole tree; a reformat is a separate, reviewable change.
max-line-length = 120
extend-ignore =
    # tab indentation, and the mixed-indentation warnings that follow from it
    W191,
    E101,
    E117,
    # blank-line and continuation-line layout inherited from upstream
    E301,
    E302,
    E303,
    E305,
    E115,
    E128,
    E124,
    # slice spacing / line-break before binary operator
    E203,
    W503,
    # long lines in strings and comments; line length is capped above anyway
    E501,
    # comment formatting ("##" block comments are used throughout on purpose)
    E265,
    E266,
    E262,
    E261,
    # whitespace around defaults and brackets, inherited from upstream
    E251,
    E201,
    E202,
    E221,
    E231,
    E225,
    E275,
    # setup.py places imports after the config variables by design
    E402,
    # peewee overloads ==/!= on model fields to build SQL expressions, so
    # `field == None` / `== True` are intentional throughout the data layer;
    # `is None` would produce a plain bool instead of a query expression
    E711,
    E712,
    # continuation-line alignment inherited from upstream
    E127,
    E129,
    E131,
    E222,
    # trailing blank lines at end of file
    W391
per-file-ignores =
    # Tests import fixtures for their side effects and bind locals for readability.
    octoprint_PrintJobHistoryExtended/test/*.py: F401, F841
exclude =
    .git,
    __pycache__,
    build,
    dist,
    node_modules,
    archive,
    3rdPartySoftware,
    *.egg-info,
    .venv,
    .pytest_cache

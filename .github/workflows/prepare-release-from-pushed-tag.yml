name: Tag pushed - prepare release
on:
  push:
    tags:
      # Glob patterns, NOT regex. "+" is a literal plus here, so the previous
      # '[0-9]+.[0-9]+.[0-9]+' matched nothing at all (it wanted a tag like
      # "2+.0+.0") and no tag push ever started a release.
      #
      # Globs cannot express "digits followed by an optional PEP 440 suffix", so
      # the release/pre-release split is decided by the "Determine prerelease"
      # step below rather than by two workflows with two patterns. This pattern
      # is therefore permissive: it matches 2.0.0, 2.0.0a2, 2.0.0rc1 and
      # 2.0.0a2.dev2 alike. The version check below rejects anything that is not
      # the version in setup.py, so a stray tag cannot produce a release.
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  # A single job on purpose - more would spin up more runners for no gain.
  PrepareRelease:
    runs-on: ubuntu-latest

    # Creating the release and uploading its asset needs write access to contents;
    # the repository default for the workflow token is read-only.
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so --generate-notes can diff against the previous tag

      - name: Check current version against tag
        env:
          TAG_ID: ${{ github.ref_name }}
        run: |
          PLUGIN_VERSION=$(grep '^plugin_version' setup.py | cut -d '"' -f2)
          echo "Plugin version in code: $PLUGIN_VERSION"
          echo "Pushed tag:             $TAG_ID"
          if [ "$PLUGIN_VERSION" != "$TAG_ID" ]; then
            echo "::error::plugin_version in setup.py does not match the pushed tag"
            exit 1
          fi

      # A pre-release is an a/b/rc/dev segment in the version, PEP 440 style:
      # 2.0.0a2, 2.0.0rc1, 2.0.0a2.dev2.
      #
      # The local part ("+hash") is cut off BEFORE matching. PEP 440 does not
      # allow a pre-release marker there, and leaving it in makes the detection
      # depend on the commit hash: "2.0.0+build2b1" would match on "2b1" and be
      # published as a pre-release even though it is a final version.
      #
      # After the cut, the marker must end at the end of the version, so a
      # ".post1" release stays final.
      - name: Determine prerelease
        id: prerelease
        env:
          TAG_ID: ${{ github.ref_name }}
        run: |
          TAG_LOWER="$(printf '%s' "$TAG_ID" | tr '[:upper:]' '[:lower:]')"
          VERSION_PART="${TAG_LOWER%%+*}"
          if echo "$VERSION_PART" | grep -qE '(^|[-.0-9])(a|b|c|rc|alpha|beta|pre|preview|dev)([.-]?[0-9]+)?$'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The suite runs in a few seconds and catches a tag pushed from a broken tree.
      # OctoPrint itself is required: the plugin module imports octoprint.plugin at
      # import time, so the tests cannot collect without it.
      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre "OctoPrint==2.0.0rc6" pytest peewee pillow
          python -m pytest octoprint_PrintJobHistoryExtended/test -q

      # -i whitelists what goes in, -x drops the test suite and its gcode fixtures:
      # those are ~3.5 MB of the artifact and of no use to an end user.
      # THIRD_PARTY_NOTICES.md and 3rdPartySoftware/ are a license obligation and must stay.
      - name: Build ZIP archive
        run: |
          zip -r main.zip * \
            -i '\octoprint_*' 'README.md' 'requirements.txt' 'setup.py' 'LICENSE.txt' \
               'THIRD_PARTY_NOTICES.md' '3rdPartySoftware/*' \
            -x 'octoprint_*/test/*' '*__pycache__*' '*.pyc'

      - name: List the archive contents for debugging
        run: unzip -l main.zip

      # A second copy under a version-independent name, for installing by hand
      # from a fixed URL in the OctoPrint plugin manager:
      #   .../releases/latest/download/OctoPrint-PrintJobHistoryExtended-latest.zip
      #
      # Only for final releases. "releases/latest" follows the newest release
      # that is not a pre-release, so attaching this to an alpha would either do
      # nothing or, worse, hand an alpha to someone who asked for the stable
      # build. The plugin's own software-update check does not use this file at
      # all - it resolves {target_version} to the exact release it picked, which
      # cannot race a newer release the way a floating name can.
      - name: Add a version-independent copy of the archive
        if: steps.prerelease.outputs.is_prerelease == 'false'
        run: cp main.zip OctoPrint-PrintJobHistoryExtended-latest.zip

      # Always a draft, pre-release or not: a release is published by hand once
      # the generated notes and the attached archive have been read. Pushing a
      # tag must never publish on its own.
      #
      # --generate-notes groups the pull requests by label into the categories
      # defined in .github/release.yml.
      - name: Create release draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSIONTAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$VERSIONTAG" --generate-notes --draft --verify-tag \
            $PRERELEASE_FLAG --title "Version $VERSIONTAG (draft)"

          # The -latest.zip copy only exists for final releases, so it is added
          # to the upload only when it is actually there - naming a missing file
          # would fail the upload and leave a release draft with no archive.
          ASSETS=(main.zip)
          if [ -f OctoPrint-PrintJobHistoryExtended-latest.zip ]; then
            ASSETS+=(OctoPrint-PrintJobHistoryExtended-latest.zip)
          fi
          gh release upload "$VERSIONTAG" "${ASSETS[@]}"

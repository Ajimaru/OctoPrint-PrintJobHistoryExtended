###
### Simple script to build a zip file of the whole repository
###
## Major - Tasks:
#  - ZIP
#  - Build draft release
#  - Attach Zip
#  - Download Zip

name: Build Plugin Release - Action
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  Build-Release-ZIP-Action:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: version
        id: version
        run: |
          # the tag is what is being released; setup.py only serves as a cross-check
          tag_version=${GITHUB_REF_NAME#v}
          setup_version=$(grep '^plugin_version' setup.py | cut -d '"' -f2)
          echo "version=$tag_version" >> $GITHUB_OUTPUT
          echo "Tag: $tag_version / setup.py: $setup_version"
          if [ "$tag_version" != "$setup_version" ]; then
            echo "::warning::Tag $tag_version does not match plugin_version $setup_version in setup.py"
          fi

      - run: echo "Build ZIP"
      - run: zip -r main.zip * -i '\octoprint_*' 'translations' 'README.md' 'requirements.txt' 'setup.py'

      - name: List files in the repository
        run: ls ${{ github.workspace }}

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: V${{ steps.version.outputs.version }}
          files: main.zip
          body: |
            ## [BugFix]
            - #xxx

            ## [Enhancement]
            - #xxx

            ## Counter
            ![downloaded](https://img.shields.io/github/downloads/${{ github.repository }}/${{ github.ref_name }}/total)

            This is a fork of [OctoPrint-PrintJobHistory](https://github.com/vojtakaniok/OctoPrint-PrintJobHistory),
            renamed so it can be installed alongside the original plugin.

      - run: echo "🍏 This job's status is ${{ job.status }}."

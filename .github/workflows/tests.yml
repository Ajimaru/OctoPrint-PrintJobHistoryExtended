name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest and highest supported interpreter; python_requires is >=3.11,<3.15.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # OctoPrint is required rather than optional: the plugin module imports
      # octoprint.plugin at import time, so pytest cannot even collect without it.
      # --pre is needed because OctoPrint 2.0.0 is only available as a release candidate.
      # The plugin is not installed - the tests import it from the working directory.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre "OctoPrint==2.0.0rc5" pytest peewee pillow

      - name: Run tests
        run: python -m pytest octoprint_PrintJobHistoryExtended/test -q

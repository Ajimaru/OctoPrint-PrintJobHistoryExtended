name: Tests

# Runs the test suite on every pull request, and on pushes to main so a merge that
# bypassed the required checks is still verified afterwards.
on:
  push:
    branches: [main]
  pull_request:

# A force-push or a quick follow-up commit makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    # Named so branch protection can require it per interpreter. Renaming this job
    # renames the status check and silently drops the protection rule on main.
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One failing interpreter should not hide the result of the others.
      fail-fast: false
      matrix:
        # Both ends of the supported range plus the development baseline;
        # python_requires is >=3.11,<3.15.
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # OctoPrint is required rather than optional: the plugin module imports
      # octoprint.plugin at import time, so pytest cannot even collect without it.
      # The version comes from requirements-dev.txt, the one place for the pin and the
      # one Dependabot updates. It used to be hard-coded here (2.0.0rc6) and kept
      # testing against that release candidate after #39 had moved the dev pin to
      # 2.0.0. If the grep finds no pin, set -e fails the step instead of silently
      # installing whatever OctoPrint is newest.
      # The plugin is not installed - the tests import it from the working directory.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          OCTOPRINT_PIN=$(grep -E '^OctoPrint==' requirements-dev.txt)
          echo "Installing $OCTOPRINT_PIN"
          python -m pip install "$OCTOPRINT_PIN" pytest peewee pillow

      - name: Run tests
        run: python -m pytest octoprint_PrintJobHistoryExtended/test -q
